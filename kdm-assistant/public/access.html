<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Archive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="access-page">
  <main class="access-card">
    <p class="eyebrow">Lantern Archive</p>
    <h1>Enter access code</h1>
    <p>Ask the person who invited you for the group code.</p>
    <form id="access-form">
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Enter archive</button>
      <p id="error" role="alert" hidden></p>
    </form>
  </main>
  <script src="/access.js"></script>
</body>
</html>
